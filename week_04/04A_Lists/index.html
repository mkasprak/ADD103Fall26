<!DOCTYPE html>
<!-- Declares this is an HTML5 document — always the first line -->
<html lang="en">
<!-- lang="en" tells browsers and screen readers the page language -->

<head>
    <!-- <head> holds metadata — nothing here is visible on the page -->
    <meta charset="UTF-8">
    <!-- UTF-8 supports all characters and emoji -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the page scale correctly on mobile devices -->
    <title>lists</title>
    <!-- Text shown in the browser tab -->
    <link rel="stylesheet" href="styles.css">
    <!-- Links our external CSS file; keeps styling separate from structure -->
</head>

<body>
    <!-- All visible content lives inside <body> -->
    <h1>Lists</h1>

    <!-- <ol> = ordered list — items are numbered automatically by the browser -->
    <h2>Ordered Lists</h2>
    <h3>Caffeine Potency</h3>
    <ol>
        <!-- <li> = list item; used inside both <ol> and <ul> -->
        <li>Monster Rehab</li>
        <li>Espresso Drinks
            <!-- Nested <ol> inside <li> creates a sub-list indented one level -->
            <!-- The nested list belongs only to the "Espresso Drinks" item -->
            <ol>
                <li>Latte</li>
                <li>Americano</li>
            </ol>
        </li>
        <li>Arnold Palmer</li>
    </ol>

    <!-- <ul> = unordered list — items use bullet points instead of numbers -->
    <h2>Unordered Lists</h2>
    <h3>Favorite Deserts</h3>
    <ul>

        <li>Cheesecake</li>
        <li>Ice Cream
            <!-- Nested <ul> creates a sub-list with a different bullet style -->
            <ul>
                <li>Cherry Garcia</li>
                <li>Pistachio</li>
            </ul>

        </li>
        <li>Lemon Meringue Pie</li>
    </ul>

    <!-- <footer> = semantic element for closing/navigation content -->
    <footer>
        <p><a href="../../index.html">Home</a></p>
        <!-- ../../ goes up two folder levels to reach the root index.html -->
    </footer>

</body>

</html>
